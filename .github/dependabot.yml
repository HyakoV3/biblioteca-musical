version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # O TypeScript 7 conflita com o svelte-check: migração planejada, não automática (SvelteKit 3 e adapter-static 4 já foram migrados)
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      tudo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      tudo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /tools/mscx2json
    schedule:
      interval: weekly
    groups:
      tudo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      tudo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /src-tauri/gen/android
    schedule:
      interval: weekly
    groups:
      tudo:
        patterns: ["*"]
        update-types: [minor, patch]
